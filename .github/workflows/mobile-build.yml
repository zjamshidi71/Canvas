# Builds the Capacitor mobile apps in the cloud — no Android Studio or Mac needed.
#
#   • Android: a debug APK (install on a phone, or upload to Appetize.io)
#   • iOS:     a simulator build (upload the .zip to Appetize.io to run in a browser)
#
# Download the results from GitHub → Actions → latest "Mobile build" run → Artifacts.
name: Mobile build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "ios/**"
      - "mobile/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/mobile-build.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Build for iOS Simulator (no signing needed)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          cd build/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/canvas-ios-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-ios-simulator
          path: canvas-ios-simulator.zip
